site_name: elastibot-v2
site_description: Slack bot for turning Elastic alerts into Kibana cases
repo_url: https://github.com/charlottecroce/elastibot-v2
repo_name: elastibot-v2
edit_uri: edit/main/docs_src/

docs_dir: docs_src
site_dir: docs

theme:
  name: readthedocs
  highlightjs: true

nav:
  - Table of Contents: index.md
  - Getting Started:
      - Installation: getting-started/install.md
      - Elastic API Keys: getting-started/api-keys.md
  - Using Elastibot:
      - Slash Commands: using/commands.md
      - Incident Messages: using/incident-messages.md
  - How It Works:
      - Architecture: internals/architecture.md
      - The Watchers: internals/watchers.md
      - Alert Grouping: internals/grouping.md
      - Incidents: internals/incidents.md
      - Cases: internals/cases.md
      - Storage: internals/storage.md
  - Reference:
      - Configuration: reference/configuration.md
      - Logging and Errors: reference/logging.md
  - Developer Guide: developer-guide.md

markdown_extensions:
  - toc:
      permalink: true
  - fenced_code
  - codehilite
  - admonition
  - tables