name: tests

# Every push to main, and every PR aimed at it. Nothing here touches a real
# cluster or a real Slack workspace - the suite is fully mocked, so no secrets
# are needed and forks can run it too
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes the run already in flight for the same branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci needs package-lock.json committed - run `npm install` locally
      # once and commit the lockfile it writes
      - run: npm ci

      - run: npm run check

      - run: npm test -- --ci