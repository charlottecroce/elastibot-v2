display_information:
  name: Elastibot
  description: Create Elastic (Kibana) cases from alerts and surface new alerts/cases in Slack.
  background_color: "#1a1c21"

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: elastibot
    always_online: true
  slash_commands:
    - command: /start
      description: Register your Elastic API key so cases are made under your username
      usage_hint: "[kibana_username]"
      should_escape: false
    - command: /case
      description: Create a case for an alert and attach it
      usage_hint: "[alertID]"
      should_escape: false
    - command: /add_alert
      description: Add an alert to an existing case
      usage_hint: "[caseID] [alertID]"
      should_escape: false
    - command: /stats
      description: Aggregate view of the alerts index - top and noisiest rules, hosts, users, timing
      usage_hint: "[window] [filters] [share]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands          # slash commands
      - chat:write        # post messages
      - chat:write.public # post to public channels without joining

settings:
  socket_mode_enabled: true
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false